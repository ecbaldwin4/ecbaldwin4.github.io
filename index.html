<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Our Flatirons Moment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="intro">
        <p class="eyebrow">Valentine's Day</p>
        <h1>Our Flatirons Forever</h1>
      </header>

      <section class="scene-wrap">
        <div class="scene" role="img" aria-label="8-bit animation of a proposal at the Flatirons in Boulder, Colorado">
          <canvas id="scene" width="480" height="270"></canvas>
          <div class="scene-overlay">
            <button id="toggle" class="pixel-button" type="button">Pause</button>
          </div>
        </div>
      </section>

      <section class="note">
	      <h2>Always On Our Trail Together</h2>
        <p>
          I proposed to you once.
	  I married you twice. 
	  I love you.
	  I love our life. 
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
